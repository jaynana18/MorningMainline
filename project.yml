name: MorningMainline
options:
  bundleIdPrefix: com.jaynana
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: HN3GC82LRP
    CODE_SIGN_STYLE: Automatic
targets:
  MorningMainline:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Shared
      - path: iOS
        excludes:
          - Info.plist
          - MorningMainline.entitlements
      # Web 产物：UI 由 web/ 的 Vue 构建承载（WKWebView 宿主，见 iOS/WebHost.swift）。
      # 用 folder reference（type: folder）：整个 dist 目录原样拷进 bundle，
      # 否则 xcodegen 会递归展开成一堆单独资源文件，破坏 `index.html` 的相对引用布局。
      # 顺序要求：先 `cd web && npm run build` 生成 web/dist，再 `xcodegen generate`。
      - path: web/dist
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynana.MorningMainline
        PRODUCT_NAME: MorningMainline
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/MorningMainline.entitlements
    dependencies:
      - target: MorningMainlineWatch
        embed: true
      - target: MainlineiOSWidget
        embed: true
  MorningMainlineWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Shared
      - path: Watch
        excludes:
          - Info.plist
          - MorningMainlineWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynana.MorningMainline.watchkitapp
        PRODUCT_NAME: MorningMainlineWatch
        INFOPLIST_FILE: Watch/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Watch/MorningMainlineWatch.entitlements
    dependencies:
      - target: MainlineWatchWidget
        embed: true
  MainlineWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidget
      - path: Shared/Services/AppGroupSharedStore.swift
      - path: Shared/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynana.MorningMainline.watchkitapp.widget
        PRODUCT_NAME: MainlineWatchWidget
        INFOPLIST_FILE: WatchWidget/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: WatchWidget/MainlineWatchWidget.entitlements
  MainlineiOSWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOSWidget
      - path: Shared/Services/AppGroupSharedStore.swift
      - path: Shared/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynana.MorningMainline.widget
        PRODUCT_NAME: MainlineiOSWidget
        INFOPLIST_FILE: iOSWidget/Info.plist
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: iOSWidget/MainlineiOSWidget.entitlements
  MorningMainlineTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: MorningMainline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaynana.MorningMainlineTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MorningMainline.app/MorningMainline"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  MorningMainlineApp:
    build:
      targets:
        MorningMainline: all
    run:
      config: Debug
    test:
      targets:
        - MorningMainlineTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
